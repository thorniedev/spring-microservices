server:
  port: 9000

spring:
  application:
    name: authorization-server

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: admin
    password: postgres@123456789
    driver-class-name: org.postgresql.Driver

#  Security:
#    oauth2:
#      authorizationserver:
#        issuer-uri: http://localhost:9000/oauth/token

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
