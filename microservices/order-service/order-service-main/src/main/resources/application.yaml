server:
  port: 8093

spring:
  main:
      web-application-type: reactive

  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/app_db
    username: admin
    password: postgres@123456789
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true