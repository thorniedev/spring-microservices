server:
  port: 8081

# Database Toggle
persistence:
    db-type: mongo

spring:
  application:
    name: customer-service

  threads:
    virtual:
      enabled: true

  mongodb:
    uri: mongodb://mongo:admin@localhost:27018/db_customer?authSource=admin
    host: localhost
    port: 27018
    username: mongo
    password: admin
    database: db_customer # Auto create when not exists
    authentication-database: admin
    representation: # MongoDB BSON needs to know what binary format to use when storing Java UUIDs
      uuid: standard

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/app_db
    username: admin
    password: postgres@123456789


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
