plugins {
    id 'spring-boot-common-conventions'
}

def catalog = project.extensions.getByType(VersionCatalogsExtension).named("libs")

dependencyManagement {
    imports {
        mavenBom catalog.findLibrary('spring-cloud-bom').get().get().toString()
    }
}

dependencies {
    implementation 'kh.edu.istad:payment-domain-core'
    implementation 'kh.edu.istad:payment-application-service'
    implementation 'kh.edu.istad:payment-service-persistence'
    implementation 'kh.edu.istad:payment-service-restapi'
    implementation 'kh.edu.istad:istad-common-restapi'

    implementation libs.spring.boot.starter.webmvc
    testImplementation libs.spring.boot.starter.webmvc.test
    testRuntimeOnly libs.junit.platform.launcher

    // Eureka Client & Load Balancer
    implementation libs.spring.cloud.starter.eureka.client
    implementation libs.spring.cloud.starter.loadbalancer
}
