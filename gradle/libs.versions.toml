[versions]
java = "25"
lombok = "1.18.40"

springBoot = "4.1.1" #separate versions
springBoot3 = "3.3.4"
springCloud2023 = "2023.0.3"

mapstruct = "1.6.3"
mapstruct-binding = "0.2.0"
dependencyManagement = "1.1.7"
junitPlatform = "1.11.4"


[libraries]
lombok = {module = "org.projectlombok:lombok", version.ref = "lombok"}

mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-annotation-processor = {module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "mapstruct-binding"}
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

spring-boot-starter-logging = { module = "org.springframework.boot:spring-boot-starter-logging" }
#spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }

spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
reactor-core = { module = "io.projectreactor:reactor-core" }

#
spring-boot-starter-data-mongodb-reactive = { module = "org.springframework.boot:spring-boot-starter-data-mongodb-reactive" }
spring-boot-starter-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
postgresql-r2dbc = { module = "org.postgresql:r2dbc-postgresql" }

junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

# Boot3 with Cloud BOM for Config Server
spring-boot3-bom = {module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot3"}
spring-cloud-bom = {module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "springCloud2023"}

# Spring Cloud
spring-cloud-config-server = { module = "org.springframework.cloud:spring-cloud-config-server" }
spring-cloud-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
spring-cloud-starter-eureka-server = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-server" }
spring-cloud-starter-eureka-client = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client" }
spring-cloud-starter-loadbalancer = { module = "org.springframework.cloud:spring-cloud-starter-loadbalancer" }

# Boot-4 BOM for all services
spring-boot4-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot"}

# Oauth-2.0
spring-boot-starter-authorization-server = { module = "org.springframework.security:spring-security-oauth2-authorization-server" }

[bundles]
spring-base = [
    "spring-boot-starter-logging",
    "spring-boot-starter-actuator"
]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }