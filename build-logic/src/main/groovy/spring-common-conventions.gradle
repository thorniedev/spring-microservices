plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

def libs = project.extensions.getByType(VersionCatalogsExtension).named("libs")

group = 'kh.edu.istad'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencyManagement {
    imports {
        // mavenBom 'org.springframework.boot:spring-boot-dependencies:4.1.1'
        mavenBom libs.findLibrary('spring-boot4-bom').get().get().toString()
    }
}

dependencies {

    // Mapstruct
    annotationProcessor libs.findLibrary('mapstruct-processor').get().get()
    annotationProcessor libs.findLibrary('mapstruct-annotation-processor').get().get()
    compileOnly libs.findLibrary('mapstruct').get().get()

    // Lombok
    compileOnly libs.findLibrary('lombok').get().get()
    annotationProcessor libs.findLibrary('lombok').get().get()

    libs.findBundle('spring-base').get().get().forEach {dep ->
        implementation dep
    }

    testImplementation libs.findLibrary('spring-boot-starter-test').get().get()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}